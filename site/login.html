<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Elashry</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border-color: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --input-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(35, 134, 54, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(56, 139, 253, 0.15) 0%, transparent 40%);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand h1 {
      color: var(--text-main);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .row-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-link {
      color: #58a6ff;
      text-decoration: none;
      transition: text-decoration 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="brand">
      <h1>تسجيل الدخول</h1>
      <p>أدخل بيانات حسابك للمتابعة</p>
    </header>

    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="identifier">البريد الإلكتروني أو اسم المستخدم</label>
        <input 
          type="text" 
          id="identifier" 
          name="identifier" 
          autocomplete="username" 
          required 
          placeholder="name@example.com"
        />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          autocomplete="current-password" 
          required 
          placeholder="••••••••"
        />
      </div>

      <div class="row-meta">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          تذكرني
        </label>
        <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="btn-submit">دخول</button>
    </form>

    <p class="footer-text">
      ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
    </p>
  </main>

</body>
</html>
